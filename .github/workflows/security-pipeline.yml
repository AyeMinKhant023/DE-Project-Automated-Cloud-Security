name: DevSecOps Shift-Left Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ============================================================================
  # JOB 1: SYNTAX, FORMATTING & STATIC LINTING
  # ============================================================================
  lint-and-validate:
    name: "IaC Linting & Schema Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: 1. Terraform Format Verification (Shift-Left)
        run: terraform fmt -check -recursive

      - name: 2. Terraform Module Initialization (Local Mode)
        run: terraform init -backend=false

      - name: 3. Terraform Syntax & Semantic Validation
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.51.1

      - name: 4. Initialize and Run TFLint
        run: |
          tflint --init
          tflint -f compact

  # ============================================================================
  # JOB 2: SHIFT-LEFT SECURITY & COMPLIANCE SCANNING (CHECKOV)
  # ============================================================================
  checkov-security-scan:
    name: "Compliance-as-Code & Security Audit (Checkov)"
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Security & Policy-as-Code Scan
        run: |
          echo "### 🛡️ Checkov Infrastructure-as-Code Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "Scanning Terraform root module and submodules for security misconfigurations..." >> $GITHUB_STEP_SUMMARY
          
          # Execute Checkov scan across Terraform modules
          checkov -d . --framework terraform \
            --output cli \
            --soft-fail

  # ============================================================================
  # JOB 3: TRIVY / TFSEC VULNERABILITY AUDIT
  # ============================================================================
  trivy-tfsec-scan:
    name: "Vulnerability & Misconfiguration Audit (Trivy / tfsec)"
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
